<!doctype html>
<html lang="fr">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<meta name="color-scheme" content="light">
<title>Mots fléchés</title>
<style>
:root {
  --ink: #21294a;
  --line: #6b7594;
  --clue: #deedfc;
  --blank: #8fb5e3;
  --arrow: #e65438;
  --mystery: #804db8;
  --word: #fff0b3;
  --cursor: #ffc94a;
  --clue-active: #ffd8cc;
  --page: #f4f6fb;
  --card: #ffffff;
  --muted: #5b6380;
  --ok: #1f8a5b;
  --cell: 40px;
  --kb-height: 0px;
}
* { box-sizing: border-box; }
html { -webkit-text-size-adjust: 100%; text-size-adjust: 100%; }
body {
  margin: 0;
  background: var(--page);
  color: var(--ink);
  font-family: -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, "Helvetica Neue", Arial, sans-serif;
}
main {
  max-width: 760px;
  margin: 0 auto;
  padding: 16px 16px calc(24px + var(--kb-height));
}
button { font: inherit; color: inherit; }

/* brand row (branded themes): logo, network doodle, tag pill */
#brand { display: flex; align-items: center; gap: 12px; margin: 2px 0 14px; }
#brand .logo { display: flex; margin-right: auto; }
#brand .logo svg { height: 30px; width: auto; }
#brand .doodle { height: 28px; width: auto; }
#brand .tag {
  background: var(--brand); color: #fff; border-radius: 999px;
  padding: 5px 13px; font-size: 12px; font-weight: 800; letter-spacing: 0.15em;
}
.tagline { text-align: center; color: var(--muted); font-style: italic; margin: -6px 0 14px; }

/* title tiles, like the PDF */
#title {
  display: flex; flex-wrap: wrap; justify-content: center;
  gap: 4px; margin: 4px 0 14px;
}
#title .tile {
  width: var(--tile, 34px); height: var(--tile, 34px);
  display: grid; place-items: center;
  border-radius: 18%;
  color: #fff; font-weight: 800; font-size: calc(var(--tile, 34px) * 0.6);
  transform: rotate(var(--tilt));
}
#title .gap { width: calc(var(--tile, 34px) * 0.45); }
#title.win .tile { animation: hop 0.6s ease-in-out calc(var(--i) * 60ms) 3; }
@keyframes hop {
  0%, 100% { transform: rotate(var(--tilt)) translateY(0); }
  50% { transform: rotate(calc(var(--tilt) * -2)) translateY(-10px); }
}

/* mystery word */
#mystery { text-align: center; margin: 0 0 14px; }
#mystery .label { color: var(--mystery); font-weight: 700; margin-right: 8px; }
#mystery .boxes {
  display: inline-flex; flex-wrap: wrap; justify-content: center;
  gap: 4px; vertical-align: middle;
}
#mystery .box {
  position: relative; width: 30px; height: 30px;
  border: 2px solid var(--mystery); border-radius: 5px; background: var(--card);
  display: grid; place-items: center; font-weight: 700; font-size: 17px;
  cursor: pointer; padding: 0;
}
#mystery .box small {
  position: absolute; right: 2px; bottom: 0; font-size: 9px;
  color: var(--mystery); font-weight: 700;
}
#mystery .dash { align-self: center; color: var(--mystery); font-weight: 700; }
#mystery .mystery-def { color: var(--mystery); font-style: italic; margin: 6px 0 0; font-size: 15px; }

/* current definition */
#cluebar {
  position: sticky; top: 0; z-index: 5;
  display: flex; align-items: center; gap: 10px;
  min-height: 56px; margin: 0 -16px 12px; padding: 8px 16px;
  background: var(--card); border-bottom: 1px solid #dde2ee;
  box-shadow: 0 2px 8px rgba(33, 41, 74, 0.06);
}
#clue-arrow {
  flex: none; width: 34px; height: 34px; border-radius: 50%;
  display: grid; place-items: center;
  background: var(--arrow); color: #fff; font-size: 20px; font-weight: 700;
}
#clue-text { font-size: 17px; line-height: 1.3; }
#clue-text .len { color: var(--muted); font-size: 14px; white-space: nowrap; }
#clue-text .hint { color: var(--muted); }

/* grid */
#board {
  position: relative; margin: 0 auto;
  width: calc(var(--cols) * var(--cell));
  height: calc(var(--rows) * var(--cell));
}
#grid {
  display: grid;
  grid-template-columns: repeat(var(--cols), var(--cell));
  grid-auto-rows: var(--cell);
  background: var(--card);
  -webkit-user-select: none; user-select: none;
}
#overlay { position: absolute; inset: 0; width: 100%; height: 100%; pointer-events: none; overflow: visible; }
.cell { position: relative; touch-action: manipulation; }
.cell.letter {
  display: grid; place-items: center; cursor: pointer;
  font-weight: 700; font-size: calc(var(--cell) * 0.56); line-height: 1;
}
.cell.letter.word { background: var(--word); }
.cell.letter.cursor { background: var(--cursor); }
.cell.clue { background: var(--clue); display: flex; flex-direction: column; cursor: pointer; }
.cell.blank { background: var(--blank); display: grid; place-items: center; color: #fff; font-size: calc(var(--cell) * 0.32); }
.def {
  flex: 1 1 0; min-height: 0; overflow: hidden;
  display: flex; align-items: center;
  padding: 0 calc(var(--cell) * 0.05);
}
.def + .def { border-top: 1px solid var(--line); }
.def.active { background: var(--clue-active); }
.def span {
  display: block; width: 100%;
  text-align: center; line-height: 1.08;
  hyphens: manual; overflow-wrap: normal; word-break: normal;
}
.def.split span { hyphens: auto; overflow-wrap: anywhere; }
.num {
  position: absolute; right: 1px; bottom: 1px;
  width: calc(var(--cell) * 0.3); height: calc(var(--cell) * 0.3);
  border-radius: 50%; background: var(--mystery); color: #fff;
  display: grid; place-items: center;
  font-size: calc(var(--cell) * 0.19); font-weight: 700;
}

/* actions */
#actions { text-align: center; margin: 20px 0 8px; }
#check {
  border: 0; border-radius: 999px; padding: 13px 26px;
  background: var(--arrow); color: #fff; font-weight: 700; font-size: 17px;
  cursor: pointer; box-shadow: 0 3px 10px color-mix(in srgb, var(--arrow) 30%, transparent);
}
#check:disabled { background: #c3c8d6; box-shadow: none; cursor: default; }
#status { min-height: 1.4em; margin: 12px 0 4px; font-size: 16px; color: var(--muted); }
#status.bad { color: var(--arrow); font-weight: 700; }
#status.good { color: var(--ok); font-weight: 700; }
#reset {
  background: none; border: 0; color: var(--muted); text-decoration: underline;
  font-size: 14px; cursor: pointer; padding: 6px;
}
.help { color: var(--muted); font-size: 13px; text-align: center; margin: 8px 0 0; }

/* on-screen keyboard (touch screens) */
#keyboard {
  display: none; position: fixed; left: 0; right: 0; bottom: 0; z-index: 10;
  padding: 6px 3px calc(6px + env(safe-area-inset-bottom));
  background: #dfe4ee; border-top: 1px solid #c9d0de;
}
body.touch #keyboard { display: block; }
#keyboard .row { display: flex; justify-content: center; max-width: 520px; margin: 0 auto; }
#keyboard button {
  flex: 1 1 0; min-width: 0; height: 46px; margin: 3px 2px;
  border: 0; border-radius: 6px; background: #fff;
  box-shadow: 0 1px 0 #aab2c4; font-size: 20px; font-weight: 600;
  touch-action: manipulation; -webkit-user-select: none; user-select: none;
  -webkit-tap-highlight-color: transparent;
}
#keyboard button.wide { flex-grow: 1.6; background: #c9d0de; font-size: 18px; }
#keyboard button.pressed { background: var(--cursor); }
</style>

eux","breaks":[]},{"dir":"down","cells":[[10,11],[11,11],[12,11],[13,11]],"clue":[9,11],"arrow":"down","def":"Elle s'analyse","breaks":[]},{"dir":"down","cells":[[2,12],[3,12],[4,12]],"clue":[1,12],"arrow":"down","def":"Éternité géologique","breaks":[]},{"dir":"down","cells":[[6,12],[7,12],[8,12]],"clue":[5,12],"arrow":"down","def":"Pour faire des requêtes","breaks":[]},{"dir":"down","cells":[[10,12],[11,12],[12,12],[13,12]],"clue":[9,12],"arrow":"down","def":"Langue du Street","breaks":[]}],"mystery":{"cells":[[8,6],[0,11],[2,7],[12,11],[11,2],[2,4],[13,7],[4,12],[8,11],[6,4]],"breaks":[],"def":"État pas démocratique"},"key":"52911db04c4ba8c78cd3813476f9593f0897a8062ef37fbba5638f5c41502d98d7b93b7f7c630b3e9f2cb73b88cf2f86e1ba64b18ccb897cb9cb7d72ae77e082b36a559af20a096ad75bd8b5c7641161074d8bf08dadfe94ce83e482ec04c2b39f72a46d45cb6f3ef2aef640a9b549e651d3d285a25b5f0ecac6f900f72d0ab3243785","theme":{"tiles":["#2d6df6","#060a45","#12b5cb","#7b4dff","#ff8a3d"],"win":"Bravo ! loss = 0, le modèle a convergé 🎉"}};

<script>
"use strict";
(function () {
  const P = PUZZLE;
  const R = P.rows, C = P.cols;
  const TILE_COLORS = P.theme.tiles;
  const ARROW_CHAR = { right: "→", down: "↓", right_then_down: "↴", down_then_right: "↳" };
  const $ = (id) => document.getElementById(id);
  const touch = window.matchMedia("(hover: none) and (pointer: coarse)").matches;
  if (touch) document.body.classList.add("touch");

  // ---- model --------------------------------------------------------------
  const key = (r, c) => r * C + c;
  const isLetter = (r, c) => r >= 0 && c >= 0 && r < R && c < C && P.layout[r][c] === ".";
  const index = new Map();  // cell key -> letter index (reading order)
  for (let r = 0; r < R; r++)
    for (let c = 0; c < C; c++)
      if (isLetter(r, c)) index.set(key(r, c), index.size);
  const N = index.size;
  const solution = unscramble(P.key, P.id);
  const slotsAt = new Map();  // cell key -> {across, down} slot indices
  const cluesAt = new Map();  // clue cell key -> {top, bottom} slot indices
  P.slots.forEach((s, i) => {
    for (const [r, c] of s.cells) {
      const k = key(r, c);
      if (!slotsAt.has(k)) slotsAt.set(k, {});
      slotsAt.get(k)[s.dir] = i;
    }
    const ck = key(s.clue[0], s.clue[1]);
    if (!cluesAt.has(ck)) cluesAt.set(ck, {});
    const exitsRight = s.arrow === "right" || s.arrow === "right_then_down";
    cluesAt.get(ck)[exitsRight ? "top" : "bottom"] = i;
  });
  const order = P.slots.map((s, i) => i).sort((a, b) => {
    const [ra, ca] = P.slots[a].cells[0], [rb, cb] = P.slots[b].cells[0];
    return (P.slots[a].dir === "across" ? 0 : 1) - (P.slots[b].dir === "across" ? 0 : 1)
      || ra - rb || ca - cb;
  });

  function keystream(id, n) {  // mirrors html_export.keystream
    let s = parseInt(id.slice(0, 8), 16) & 0x7fffffff;
    const out = [];
    for (let i = 0; i < n; i++) {
      s = (Math.imul(s, 1103515245) + 12345) & 0x7fffffff;
      out.push((s >>> 16) & 0xff);
    }
    return out;
  }
  function unscramble(hex, id) {
    const n = hex.length / 2, ks = keystream(id, n);
    let out = "";
    for (let i = 0; i < n; i++)
      out += String.fromCharCode(parseInt(hex.substr(2 * i, 2), 16) ^ ks[i]);
    return out;
  }

  // ---- state (saved in this browser) ---------------------------------------
  const STORE = "arroword:" + P.id;
  let letters = new Array(N).fill("");
  try {
    const saved = localStorage.getItem(STORE);
    if (saved && saved.length === N)
      letters = [...saved].map((ch) => (ch === "." ? "" : ch));
  } catch (e) { /* storage unavailable: start empty */ }
  function save() {
    try { localStorage.setItem(STORE, letters.map((l) => l || ".").join("")); } catch (e) { }
  }
  let cur = null;      // [r, c] of the cursor
  let slot = null;     // active slot index
  let verdict = null;  // last check result, cleared by any edit

  // ---- building the page -----------------------------------------------------
  const grid = $("grid"), board = $("board");
  board.style.setProperty("--cols", C);
  board.style.setProperty("--rows", R);
  grid.style.setProperty("--cols", C);
  const cellEls = new Map(), defEls = new Map();
  for (let r = 0; r < R; r++) {
    for (let c = 0; c < C; c++) {
      const el = document.createElement("div");
      el.dataset.r = r; el.dataset.c = c;
      if (isLetter(r, c)) {
        el.className = "cell letter";
        el.appendChild(document.createElement("b"));
      } else {
        const clue = cluesAt.get(key(r, c));
        if (!clue) {
          el.className = "cell blank";
          el.textContent = "★";
        } else {
          el.className = "cell clue";
          for (const part of ["top", "bottom"]) {
            if (clue[part] === undefined) continue;
            const def = document.createElement("div");
            def.className = "def";
            def.dataset.slot = clue[part];
            const span = document.createElement("span");
            span.textContent = P.slots[clue[part]].def;
            def.appendChild(span);
            el.appendChild(def);
            defEls.set(clue[part], def);
          }
        }
      }
      cellEls.set(key(r, c), el);
      grid.appendChild(el);
    }
  }
  if (P.mystery) {
    P.mystery.cells.forEach(([r, c], i) => {
      const num = document.createElement("span");
      num.className = "num";
      num.textContent = i + 1;
      cellEls.get(key(r, c)).appendChild(num);
    });
  }
  drawOverlay();
  drawTitle();
  const mysteryBoxes = buildMystery();
  buildKeyboard();
  $("help").textContent = touch
    ? "Touchez une case ou une définition. Touchez à nouveau la case pour changer de sens."
    : "Cliquez une case ou une définition, puis tapez. Entrée ou un second clic change de sens, Tab passe au mot suivant.";

  function drawOverlay() {
    const svg = $("overlay"), NS = "http://www.w3.org/2000/svg";
    svg.setAttribute("viewBox", `0 0 ${C} ${R}`);
    svg.setAttribute("preserveAspectRatio", "none");
    const add = (tag, attrs) => {
      const el = document.createElementNS(NS, tag);
      for (const [k, v] of Object.entries(attrs)) el.setAttribute(k, v);
      svg.appendChild(el);
      return el;
    };
    // grid lines; the edge inside a word at a space / hyphen is dotted
    const dotted = new Set();
    for (const s of P.slots)
      for (const i of s.breaks) dotted.add(key(...s.cells[i - 1]) + ":" + key(...s.cells[i]));
    let lines = "", dots = "";
    for (let r = 0; r < R; r++) {
      for (let c = 0; c < C; c++) {
        if (c > 0) {
          const seg = `M${c} ${r}V${r + 1}`;
          if (dotted.has(key(r, c - 1) + ":" + key(r, c))) dots += seg; else lines += seg;
        }
        if (r > 0) {
          const seg = `M${c} ${r}H${c + 1}`;
          if (dotted.has(key(r - 1, c) + ":" + key(r, c))) dots += seg; else lines += seg;
        }
      }
    }
    add("path", { d: lines, stroke: "var(--line)", "stroke-width": 1, fill: "none",
                  "vector-effect": "non-scaling-stroke" });
    if (dots) add("path", { d: dots, stroke: "var(--ink)", "stroke-width": 0.05, fill: "none",
                            "stroke-linecap": "round", "stroke-dasharray": "0.001 0.111" });
    add("rect", { x: 0, y: 0, width: C, height: R, fill: "none", stroke: "var(--ink)",
                  "stroke-width": 2.5, "vector-effect": "non-scaling-stroke" });
    // arrows on the clue cell's exit side, reaching into the first letter
    const h = 0.075;
    const head = (x, y, dx, dy) => {
      const bx = x - dx * h * 1.3, by = y - dy * h * 1.3;
      add("path", { d: `M${x} ${y}L${bx - dy * h * 0.8} ${by + dx * h * 0.8}` +
                       `L${bx + dy * h * 0.8} ${by - dx * h * 0.8}Z`, fill: "var(--arrow)" });
    };
    const stroke = { stroke: "var(--arrow)", "stroke-width": 0.03, fill: "none" };
    for (const s of P.slots) {
      const [y, x] = s.clue;
      const clue = cluesAt.get(key(y, x));
      const double = clue.top !== undefined && clue.bottom !== undefined;
      if (s.arrow === "right") {
        const ay = y + (double ? 0.25 : 0.5);
        add("path", { d: `M${x + 0.98} ${ay}H${x + 1.12}`, ...stroke });
        head(x + 1.17, ay, 1, 0);
      } else if (s.arrow === "down") {
        const ax = x + 0.5;
        add("path", { d: `M${ax} ${y + 0.98}V${y + 1.12}`, ...stroke });
        head(ax, y + 1.17, 0, 1);
      } else if (s.arrow === "right_then_down") {
        const ay = y + 0.17, bx = x + 1.2;
        add("path", { d: `M${x + 0.98} ${ay}H${bx}V${ay + 0.14}`, ...stroke });
        head(bx, ay + 0.19, 0, 1);
      } else {
        const ax = x + 0.17, by = y + 1.2;
        add("path", { d: `M${ax} ${y + 0.98}V${by}H${ax + 0.14}`, ...stroke });
        head(ax + 0.19, by, 1, 0);
      }
    }
  }

  function drawTitle() {
    const header = $("title");
    let color = 0;
    [...P.title].forEach((ch, i) => {
      const el = document.createElement("span");
      if (ch.trim() === "") { el.className = "gap"; header.appendChild(el); return; }
      el.className = "tile";
      el.textContent = ch.toUpperCase();
      el.style.background = TILE_COLORS[color % TILE_COLORS.length];
      el.style.setProperty("--tilt", color % 2 ? "3deg" : "-3deg");
      el.style.setProperty("--i", i);
      header.appendChild(el);
      color++;
    });
    document.title = P.title;
  }

  function buildMystery() {
    if (!P.mystery) return [];
    const section = $("mystery"), boxes = section.querySelector(".boxes");
    section.hidden = false;
    const els = P.mystery.cells.map(([r, c], i) => {
      if (P.mystery.breaks.includes(i)) {
        const dash = document.createElement("span");
        dash.className = "dash";
        dash.textContent = "–";
        boxes.appendChild(dash);
      }
      const box = document.createElement("button");
      box.className = "box";
      box.setAttribute("aria-label", "Lettre " + (i + 1));
      box.innerHTML = "<b></b><small>" + (i + 1) + "</small>";
      box.addEventListener("click", () => select(r, c, currentDir()));
      boxes.appendChild(box);
      return box.firstChild;
    });
    if (P.mystery.def) {
      const def = section.querySelector(".mystery-def");
      def.textContent = P.mystery.def;
      def.hidden = false;
    }
    return els;
  }

  function buildKeyboard() {
    const kb = $("keyboard");
    const rows = ["AZERTYUIOP", "QSDFGHJKLM", "⇄WXCVBN⌫"];
    for (const row of rows) {
      const line = document.createElement("div");
      line.className = "row";
      for (const k of row) {
        const b = document.createElement("button");
        b.type = "button";
        b.textContent = k;
        if (k === "⇄") { b.className = "wide"; b.setAttribute("aria-label", "Changer de sens"); }
        if (k === "⌫") { b.className = "wide"; b.setAttribute("aria-label", "Effacer"); }
        b.addEventListener("pointerdown", (e) => {
          e.preventDefault();
          b.classList.add("pressed");
          setTimeout(() => b.classList.remove("pressed"), 120);
          if (k === "⇄") toggleDir();
          else if (k === "⌫") backspace();
          else type(k);
        });
        line.appendChild(b);
      }
      kb.appendChild(line);
    }
  }

  // ---- sizing ------------------------------------------------------------------
  function layout() {
    const main = document.querySelector("main");
    const width = main.clientWidth - 32;
    let cell = width / C;
    if (!touch) cell = Math.min(cell, Math.max(34, (window.innerHeight - 170) / R));
    cell = Math.max(18, Math.floor(Math.min(cell, 64)));
    document.documentElement.style.setProperty("--cell", cell + "px");
    const tile = Math.floor(Math.min(34, (width - 4 * P.title.length) / P.title.length));
    $("title").style.setProperty("--tile", tile + "px");
    const kb = $("keyboard");
    document.documentElement.style.setProperty(
      "--kb-height", (touch ? kb.offsetHeight : 0) + "px");
    fitDefinitions(cell);
  }

  // Largest font that fits each definition box; splitting a word is a last
  // resort, like the PDF.
  function fitDefinitions(cell) {
    const max = Math.min(cell * 0.21, 13), min = 3;
    for (const def of defEls.values()) {
      const span = def.firstChild;
      const fits = (size) => {
        span.style.fontSize = size + "px";
        return span.scrollWidth <= span.clientWidth + 0.5
          && span.getBoundingClientRect().height <= def.clientHeight - 1;
      };
      def.classList.remove("split");
      if (!fits(min)) def.classList.add("split");
      let lo = min, hi = max;
      if (fits(hi)) continue;
      while (hi - lo > 0.25) {
        const mid = (lo + hi) / 2;
        if (fits(mid)) lo = mid; else hi = mid;
      }
      fits(lo);
    }
  }

  // ---- interaction -------------------------------------------------------------
  function currentDir() { return slot === null ? "across" : P.slots[slot].dir; }

  function select(r, c, dir) {
    const at = slotsAt.get(key(r, c));
    if (!at) return;
    const other = dir === "across" ? "down" : "across";
    slot = at[dir] !== undefined ? at[dir] : at[other];
    cur = [r, c];
    render(true);
  }

  function selectSlot(i) {
    slot = i;
    const cells = P.slots[i].cells;
    cur = cells.find(([r, c]) => !letters[index.get(key(r, c))]) || cells[0];
    render(true);
  }

  function toggleDir() {
    if (!cur) { selectSlot(order[0]); return; }
    const at = slotsAt.get(key(...cur));
    const other = currentDir() === "across" ? "down" : "across";
    if (at[other] !== undefined) { slot = at[other]; render(true); }
  }

  function position() {
    return P.slots[slot].cells.findIndex(([r, c]) => r === cur[0] && c === cur[1]);
  }

  function setLetter(r, c, ch) {
    letters[index.get(key(r, c))] = ch;
    verdict = null;
    save();
  }

  function type(ch) {
    if (!cur) { selectSlot(order[0]); }
    setLetter(cur[0], cur[1], ch);
    const cells = P.slots[slot].cells, k = position();
    if (k < cells.length - 1) cur = cells[k + 1];
    render(true);
  }

  function backspace() {
    if (!cur) return;
    if (letters[index.get(key(...cur))]) {
      setLetter(cur[0], cur[1], "");
    } else {
      const k = position();
      if (k > 0) {
        cur = P.slots[slot].cells[k - 1];
        setLetter(cur[0], cur[1], "");
      }
    }
    render(true);
  }

  function move(dr, dc) {
    if (!cur) { selectSlot(order[0]); return; }
    const dir = dc ? "across" : "down";
    const at = slotsAt.get(key(...cur));
    if (currentDir() !== dir && at[dir] !== undefined) { slot = at[dir]; render(true); return; }
    let [r, c] = cur;
    do { r += dr; c += dc; } while (r >= 0 && c >= 0 && r < R && c < C && !isLetter(r, c));
    if (isLetter(r, c)) select(r, c, dir);
  }

  function nextSlot(step) {
    const k = slot === null ? -1 : order.indexOf(slot);
    selectSlot(order[(k + step + order.length) % order.length]);
  }

  grid.addEventListener("click", (e) => {
    const def = e.target.closest(".def");
    if (def) { selectSlot(Number(def.dataset.slot)); return; }
    const el = e.target.closest(".cell.letter");
    if (!el) return;
    const r = Number(el.dataset.r), c = Number(el.dataset.c);
    if (cur && cur[0] === r && cur[1] === c) toggleDir();
    else select(r, c, currentDir());
  });

  document.addEventListener("keydown", (e) => {
    if (e.ctrlKey || e.metaKey || e.altKey) return;
    const onButton = e.target.closest && e.target.closest("button");
    if (onButton && (e.key === "Enter" || e.key === " ")) return;
    const letter = e.key.length === 1
      ? e.key.normalize("NFD").replace(/[̀-ͯ]/g, "").toUpperCase() : "";
    if (/^[A-Z]$/.test(letter)) type(letter);
    else if (e.key === "Backspace") backspace();
    else if (e.key === "Delete") { if (cur) { setLetter(cur[0], cur[1], ""); render(false); } }
    else if (e.key === "ArrowRight") move(0, 1);
    else if (e.key === "ArrowLeft") move(0, -1);
    else if (e.key === "ArrowDown") move(1, 0);
    else if (e.key === "ArrowUp") move(-1, 0);
    else if (e.key === "Tab") nextSlot(e.shiftKey ? -1 : 1);
    else if (e.key === "Enter" || e.key === " ") toggleDir();
    else return;
    e.preventDefault();
  });

  $("check").addEventListener("click", () => {
    if (letters.some((l) => !l)) return;
    verdict = letters.reduce((n, l, i) => n + (l !== solution[i] ? 1 : 0), 0);
    render(false);
    if (verdict === 0) {
      const header = $("title");
      header.classList.remove("win");
      void header.offsetWidth;  // restart the animation
      header.classList.add("win");
    }
  });

  $("reset").addEventListener("click", () => {
    if (!confirm("Effacer toutes les lettres de la grille ?")) return;
    letters = new Array(N).fill("");
    verdict = null;
    save();
    render(false);
  });

  // ---- rendering ---------------------------------------------------------------
  function render(follow) {
    const active = slot === null ? null : P.slots[slot];
    const inWord = new Set(active ? active.cells.map(([r, c]) => key(r, c)) : []);
    for (const [k, i] of index) {
      const el = cellEls.get(k);
      el.firstChild.textContent = letters[i];
      el.classList.toggle("word", inWord.has(k));
      el.classList.toggle("cursor", !!cur && k === key(...cur));
    }
    for (const [i, def] of defEls) def.classList.toggle("active", i === slot);
    if (P.mystery)
      P.mystery.cells.forEach(([r, c], i) => {
        mysteryBoxes[i].textContent = letters[index.get(key(r, c))];
      });

    const text = $("clue-text");
    if (active) {
      $("clue-arrow").textContent = ARROW_CHAR[active.arrow];
      text.textContent = active.def + " ";
      const len = document.createElement("span");
      len.className = "len";
      len.textContent = "(" + active.cells.length + " lettres)";
      text.appendChild(len);
    } else {
      text.innerHTML = '<span class="hint">Choisissez une case ou une définition pour commencer.</span>';
    }

    const empty = letters.filter((l) => !l).length;
    const check = $("check"), status = $("status");
    check.disabled = empty > 0;
    status.className = "";
    if (verdict === 0) {
      status.className = "good";
      status.textContent = P.theme.win;
    } else if (verdict !== null) {
      status.className = "bad";
      status.textContent = verdict + (verdict > 1 ? " lettres fausses" : " lettre fausse");
    } else if (empty > 0) {
      status.textContent = "Encore " + empty + (empty > 1 ? " cases" : " case") + " à remplir";
    } else {
      status.textContent = "Grille complète, vous pouvez vérifier vos réponses.";
    }
    if (follow && cur) keepVisible(cellEls.get(key(...cur)));
  }

  // Scroll so the cursor is neither under the definition bar nor the keyboard.
  function keepVisible(el) {
    const rect = el.getBoundingClientRect();
    const top = $("cluebar").getBoundingClientRect().bottom + 4;
    const bottom = window.innerHeight - (touch ? $("keyboard").offsetHeight : 0) - 4;
    if (rect.top < top) window.scrollBy(0, rect.top - top);
    else if (rect.bottom > bottom) window.scrollBy(0, rect.bottom - bottom);
  }

  let resizeTimer = null;
  window.addEventListener("resize", () => {
    clearTimeout(resizeTimer);
    resizeTimer = setTimeout(layout, 150);
  });
  layout();
  render(false);
  if (document.fonts && document.fonts.ready) document.fonts.ready.then(layout);
})();
</script>
</body>
</html>
